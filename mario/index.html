<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#000; display:flex; justify-content:center; align-items:center;
  min-height:100vh; font-family:'Press Start 2P',monospace; overflow:hidden;
}
#game-container canvas { display:block; }
#modal-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,10,.93); z-index:9000;
  justify-content:center; align-items:center;
}
#modal-overlay.active { display:flex; }
#modal {
  background:#0a0a1e; border:3px solid #ffd700;
  box-shadow:0 0 50px rgba(255,215,0,.35),inset 0 0 30px rgba(255,215,0,.04);
  padding:30px 26px; max-width:600px; width:94%;
  max-height:84vh; overflow-y:auto; color:#fff;
  position:relative; animation:mpop .22s cubic-bezier(.34,1.56,.64,1);
  scrollbar-color:#ffd700 #0a0a1e;
}
@keyframes mpop {
  from{transform:scale(.4) translateY(60px);opacity:0}
  to{transform:scale(1) translateY(0);opacity:1}
}
#modal-close {
  position:absolute; top:10px; right:10px;
  background:#cc0000; color:#fff; border:none;
  padding:8px 12px; font-family:'Press Start 2P'; font-size:9px; cursor:pointer;
}
#modal-close:hover{background:#ff2222}
.modal-title{font-size:15px;color:#ffd700;text-align:center;margin-bottom:20px;letter-spacing:2px}
.modal-content{font-size:10px;line-height:2.3;color:#ccc}
.stat-box{background:#0d0d2e;border-left:4px solid #ffd700;padding:14px 16px;margin:12px 0;font-size:10px;line-height:2.3}
.stat-box.green{border-color:#00ff88} .stat-box.pink{border-color:#ff88ff}
.stat-box.blue{border-color:#88ddff}  .stat-box.orange{border-color:#ff8844}
.sh{font-size:11px;margin-bottom:10px}
.btn-link{display:block;text-align:center;padding:10px 14px;margin:7px 0;
  text-decoration:none;font-size:9px;font-family:'Press Start 2P';
  border:2px solid #aa7700;background:#ffd700;color:#000;transition:filter .15s}
.btn-link:hover{filter:brightness(1.2)}
.btn-link.blue{background:#0077b5;border-color:#005588;color:#fff}
.btn-link.green{background:#00aa44;border-color:#007733;color:#fff}
.btn-link.dark{background:#222;border-color:#555;color:#fff}
.btn-link.red{background:#cc0000;border-color:#880000;color:#fff}
#controls-hint{
  position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.72);border:2px solid rgba(255,215,0,.35);
  color:#ffd700;font-size:7px;padding:7px 16px;pointer-events:none;
  z-index:500;letter-spacing:1px;white-space:nowrap;
}
#music-btn{

  border:3px solid #aa7700;color:#000;padding:9px 13px;
  font-family:'Press Start 2P';font-size:8px;cursor:pointer;z-index:8000;
}
#music-btn:hover{background:#fff}
#portal-btn{
  position:fixed;bottom:14px;left:16px;background:#00ffff;
  border:3px solid #00aaaa;color:#000;padding:9px 13px;
  font-family:'Press Start 2P';font-size:8px;cursor:pointer;z-index:8000;
  text-decoration:none;
}
#portal-btn:hover{background:#fff;border-color:#ccc;}

/* Mobile D-pad Controls Overlay */
#mobile-controls {
  display: none;
  position: fixed;
  bottom: 20px;
  left: 0;
  width: 100%;
  padding: 0 16px;
  z-index: 9000;
  pointer-events: none;
  justify-content: space-between;
  box-sizing: border-box;
}
@media (max-width: 1024px) {
  #mobile-controls {
    display: flex;
  }
  #portal-btn {
    top: 14px;
    bottom: auto;
    left: 16px;
  }
  #music-btn {
    top: 14px;
    bottom: auto;
    right: 16px;
  }
  #controls-hint {
    top: 14px;
    bottom: auto;
    font-size: 6px;
    padding: 8px 12px;
  }
}
.dpad-left, .dpad-right {
  display: flex;
  pointer-events: auto;
}
.ctrl-btn {
  width: 62px;
  height: 62px;
  background: rgba(0, 0, 0, 0.75);
  border: 4px solid #ffd700;
  color: #ffd700;
  border-radius: 50%;
  font-family: 'Press Start 2P', monospace;
  font-size: 16px;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  touch-action: none;
  user-select: none;
  margin: 0 6px;
  outline: none;
  box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}
.ctrl-btn:active {
  background: #ffd700;
  color: #000;
  box-shadow: 0 0 15px #ffd700;
}

  </div>

  </div>
</div>

<script>
window.mobileControls = { left: false, right: false, down: false, jump: false };
document.addEventListener('DOMContentLoaded', () => {
  if (window.innerWidth <= 1024) {
    const hint = document.getElementById('controls-hint');
    if (hint) {
      hint.innerHTML = '◀ ▶ MOVE &nbsp;|&nbsp; A JUMP &nbsp;|&nbsp; ▼ ENTER PIPE &nbsp;|&nbsp; 🍄 MUSHROOM = GROW!';
    }
  }

  const setupMobileButton = (id, key) => {
    const btn = document.getElementById(id);
    if (btn) {
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        window.mobileControls[key] = true;
      });
      btn.addEventListener('touchend', (e) => {
        e.preventDefault();
        window.mobileControls[key] = false;
      });
      btn.addEventListener('touchcancel', (e) => {
        e.preventDefault();
        window.mobileControls[key] = false;
      });
    }
  };
  setupMobileButton('btn-left', 'left');
  setupMobileButton('btn-right', 'right');
  setupMobileButton('btn-down', 'down');
  setupMobileButton('btn-jump', 'jump');
});

   AUDIO
══════════════════════════════ */
let AC=null, musicOn=false, themeTimeout=null, themeIdx=0;
const THEME=[[660,.1],[660,.2],[0,.1],[660,.1],[0,.1],[510,.1],[660,.2],
  [770,.2],[0,.2],[380,.2],[0,.1],[510,.2],[0,.1],[380,.2],
  [320,.2],[0,.1],[440,.2],[494,.1],[466,.1],[440,.2],
  [392,.15],[660,.15],[784,.2],[880,.1],[698,.1],[784,.2]];
function getAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC;}
function beep(freq,type,vol,dur){
  try{const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    o.start();o.stop(ac.currentTime+dur);}catch(e){}
}
function sfxJump()   {beep(380,'sine',    0.14,0.18);}
function sfxCoin()   {beep(900,'square',  0.11,0.09);}
function sfxBlock()  {beep(180,'triangle',0.18,0.14);}
function sfxPipe()   {beep(280,'sine',    0.16,0.28);}
function sfxGrow()   {[300,400,500,650].forEach((f,i)=>setTimeout(()=>beep(f,'sine',0.2,0.12),i*80));}
function sfxShrink() {[650,500,400,250].forEach((f,i)=>setTimeout(()=>beep(f,'sine',0.2,0.12),i*80));}
function sfxVictory(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,'sine',0.2,0.22),i*160));}
function playThemeNote(){
  if(!musicOn)return;
  const[freq,dur]=THEME[themeIdx++%THEME.length];
  if(freq>0)beep(freq,'square',0.045,dur*0.88);
  themeTimeout=setTimeout(playThemeNote,dur*1000);
}
function toggleMusic(){
  musicOn=!musicOn;
  document.getElementById('music-btn').textContent=musicOn?'♪ ON':'♪ OFF';
  if(musicOn){themeIdx=0;playThemeNote();}else clearTimeout(themeTimeout);
}

══════════════════════════════ */
let score=0;
function openModal(key){
  document.getElementById('modal-body').innerHTML=MODALS[key]||'';
  document.getElementById('modal-overlay').classList.add('active');
  if(key==='victory'){setTimeout(()=>{const e=document.getElementById('final-coins');if(e)e.textContent=score;},50);}
  const s=game.scene.scenes.find(s=>s.scene.key==='GameScene');
  if(s)s.physics.pause();
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('active');
  const s=game.scene.scenes.find(s=>s.scene.key==='GameScene');
  if(s)s.physics.resume();
}
function overlayClick(e){if(e.target.id==='modal-overlay')closeModal();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

class BootScene extends Phaser.Scene {
  constructor(){super({key:'BootScene'});}
  create(){
    const W=this.scale.width, H=this.scale.height;
    // Dark background
    this.add.rectangle(W/2,H/2,W,H,0x000010);

    // Logo text
    this.add.text(W/2,H/2-130,'PARTH AHUJA',{
      fontFamily:'Press Start 2P',fontSize:'26px',fill:'#ffd700',
      stroke:'#cc0000',strokeThickness:6
    }).setOrigin(0.5);
    this.add.text(W/2,H/2-90,'PORTFOLIO · WORLD 1-1',{
      fontFamily:'Press Start 2P',fontSize:'9px',fill:'#aaffaa'
    }).setOrigin(0.5);

    // Mini Mario pixel art (static, drawn with rectangles)
    const m=this.add.graphics();
    const mx=W/2-16, my=H/2-60;
    m.fillStyle(0xdd0000); m.fillRect(mx+8,my,18,6); m.fillRect(mx+4,my+6,24,4);
    m.fillStyle(0xffaa60); m.fillRect(mx+6,my+10,20,12);
    m.fillStyle(0x222222); m.fillRect(mx+18,my+12,7,5);
    m.fillStyle(0x6b3310); m.fillRect(mx+8,my+20,16,4);
    m.fillStyle(0x0022cc); m.fillRect(mx+4,my+24,24,14);
    m.fillStyle(0xdd0000); m.fillRect(mx+4,my+24,8,8); m.fillRect(mx+20,my+24,8,8);
    m.fillStyle(0xffd700); m.fillRect(mx+13,my+26,6,7);
    m.fillStyle(0x0033dd); m.fillRect(mx+4,my+38,11,8); m.fillRect(mx+17,my+38,11,8);
    m.fillStyle(0x5c2800); m.fillRect(mx+1,my+46,15,4); m.fillRect(mx+16,my+46,15,4);
    // Bounce mario up and down
    this.tweens.add({targets:m,y:-8,duration:500,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});

    // Progress bar background
    const barX=W*0.1, barY=H/2+20, barW=W*0.8, barH=22;
    const barBg=this.add.graphics();
    barBg.fillStyle(0x222244); barBg.fillRect(barX,barY,barW,barH);
    barBg.lineStyle(2,0xffd700); barBg.strokeRect(barX,barY,barW,barH);

    const bar=this.add.graphics();
    const loadTxt=this.add.text(W/2,barY+barH+14,'LOADING...',{
      fontFamily:'Press Start 2P',fontSize:'9px',fill:'#ffd700'
    }).setOrigin(0.5);

    // Blinking dots
    let dots=0;
    const dotTimer=this.time.addEvent({delay:300,repeat:-1,callback:()=>{
      dots=(dots+1)%4;
      loadTxt.setText('LOADING'+'.'.repeat(dots));
    }});

    // Fake progress over 2.2 seconds
    let progress=0;
    const step=this.time.addEvent({delay:22,repeat:99,callback:()=>{
      progress+=0.01;
      bar.clear();
      const fillW=barW*Math.min(progress,1);
      // Gradient fill using segments
      const r1=0x00,g1=0xaa,b1=0xff;
      const r2=0xff,g2=0xdd,b2=0x00;
      for(let i=0;i<fillW;i++){
        const t=i/barW;
        const r=Math.floor(r1+(r2-r1)*t);
        const g=Math.floor(g1+(g2-g1)*t);
        const b=Math.floor(b1+(b2-b1)*t);
        bar.fillStyle((r<<16)|(g<<8)|b);
        bar.fillRect(barX+i,barY,1,barH);
      }
      if(progress>=1){
        dotTimer.remove();
        step.remove();
        loadTxt.setText('READY!');
        this.time.delayedCall(400,()=>this.scene.start('TitleScene'));
      }
    }});
  }
}

    g.fillStyle(0x0033dd);
    if(walkA){g.fillRect(ox+4,oy+38,11,10);g.fillRect(ox+17,oy+35,11,7);}
    else if(walkB){g.fillRect(ox+4,oy+35,11,7);g.fillRect(ox+17,oy+38,11,10);}
    else{g.fillRect(ox+4,oy+38,11,8);g.fillRect(ox+17,oy+38,11,8);}
    // Shoes
    g.fillStyle(0x5c2800);
    if(jump){g.fillRect(ox+0,oy+46,15,4);g.fillRect(ox+17,oy+44,15,4);}
    else{g.fillRect(ox+1,oy+46,15,4);g.fillRect(ox+16,oy+46,15,4);}
  }

  // Draw big Mario (taller)
  _drawMarioBig(g,ox,oy,walkA,walkB,jump){
    // Cap
    g.fillStyle(0xdd0000);g.fillRect(ox+8,oy,18,8);g.fillRect(ox+4,oy+8,26,5);
    // Face
    g.fillStyle(0xffaa60);g.fillRect(ox+5,oy+13,22,16);
    // Eye
    g.fillStyle(0x222222);g.fillRect(ox+18,oy+15,8,6);
    g.fillStyle(0xffffff);g.fillRect(ox+20,oy+16,4,4);
    // Moustache
    g.fillStyle(0x6b3310);g.fillRect(ox+7,oy+26,18,4);
    // Body (taller)
    g.fillStyle(0x0022cc);g.fillRect(ox+3,oy+30,26,20);
    g.fillStyle(0xdd0000);g.fillRect(ox+3,oy+30,9,10);g.fillRect(ox+20,oy+30,9,10);
    g.fillStyle(0xffd700);g.fillRect(ox+12,oy+33,8,8);
    // Legs
    g.fillStyle(0x0033dd);
    if(walkA){g.fillRect(ox+3,oy+50,12,10);g.fillRect(ox+17,oy+47,12,7);}
    else if(walkB){g.fillRect(ox+3,oy+47,12,7);g.fillRect(ox+17,oy+50,12,10);}
    else{g.fillRect(ox+3,oy+50,12,9);g.fillRect(ox+17,oy+50,12,9);}
    // Shoes
    g.fillStyle(0x5c2800);
    if(jump){g.fillRect(ox+0,oy+59,15,5);g.fillRect(ox+17,oy+57,15,5);}
    else{g.fillRect(ox+0,oy+59,15,5);g.fillRect(ox+17,oy+59,15,5);}
  }

  // ── BLOCK HIT ──
  _onBlockHit(player,block){
    if(block.getData('used'))return;
    if(!player.body.touching.up)return;
    block.setData('used',true);
    block.setTexture('usedblock').clearTint().refreshBody();
    sfxBlock();
    this.tweens.add({targets:block,y:block.y-10,duration:85,yoyo:true,ease:'Cubic.Out'});

    if(block.getData('mushroom')){
      // Always spawn mushroom - player collects it only if small, otherwise it just walks off
      const mush=this.mushrooms.create(block.x,block.y-20,'mushroom');
      mush.setVelocityX(80);
      mush.setDepth(8);
      this.tweens.add({targets:mush,y:block.y-54,duration:280,ease:'Back.Out'});
      const t=this.add.text(block.x,block.y-20,'🍄 MUSHROOM!',{
        fontFamily:'Arial',fontSize:'12px',fill:'#ff4400',stroke:'#000',strokeThickness:3
      }).setDepth(30).setOrigin(0.5);
      this.tweens.add({targets:t,y:block.y-82,alpha:0,duration:900,ease:'Cubic.Out',onComplete:()=>t.destroy()});
    } else {
      // Regular coin
      const coin=this.coins.create(block.x,block.y-20,'coin');
      coin.setVelocityY(-220);
      coin.setDepth(15);
      const t=this.add.text(block.x,block.y-20,'+10',{
        fontFamily:'Arial',fontSize:'14px',fill:'#ffd700',stroke:'#000',strokeThickness:3
      }).setDepth(30).setOrigin(0.5);
      this.tweens.add({targets:t,y:block.y-80,alpha:0,duration:700,ease:'Cubic.Out',onComplete:()=>t.destroy()});
    }
  }

  // ── COIN COLLECT ──
  _onCoinCollect(player,coin){
    const cx=coin.x,cy=coin.y;
    this.tweens.killTweensOf(coin);
    coin.disableBody(true,true);
    score+=10;
    this.scoreText.setText('🪙 '+String(score).padStart(3,'0'));
    sfxCoin();
    const colors=[0xffd700,0xffaa00,0xffffff,0xff8800];
    for(let i=0;i<8;i++){
      const angle=(i/8)*Math.PI*2;
      const r=this.add.rectangle(cx,cy,5,5,colors[i%4]).setDepth(25);
      this.tweens.add({targets:r,x:cx+Math.cos(angle)*30,y:cy+Math.sin(angle)*30,
        alpha:0,scaleX:0,scaleY:0,duration:380,ease:'Cubic.Out',onComplete:()=>r.destroy()});
    }
  }

  // ── MUSHROOM COLLECT ──
  _onMushroom(player,mush){
    mush.disableBody(true,true);
    sfxGrow();
    this._isBig=true;
    this.sizeText.setText('▸ SUPER MARIO!').setStyle({fill:'#ffdd00'});
    // Flash grow effect
    this.player.setScale(1.2);
    this.tweens.add({targets:this.player,scaleX:1,scaleY:1,duration:400,ease:'Bounce.Out'});
    // Resize physics body for big Mario
    this.player.setTexture('mario_big_idle');
    this.player.body.setSize(28,60);
    // Score
    score+=200;
    this.scoreText.setText('🪙 '+String(score).padStart(3,'0'));
    const t=this.add.text(player.x,player.y-40,'SUPER MARIO! +200',{
      fontFamily:'Arial',fontSize:'13px',fill:'#ffdd00',stroke:'#000',strokeThickness:4
    }).setDepth(30).setOrigin(0.5);
    this.tweens.add({targets:t,y:player.y-110,alpha:0,duration:1200,ease:'Cubic.Out',onComplete:()=>t.destroy()});
  }

  // ── GOOMBA HIT ──
  _onGoomba(player,goomba){
    if(this._invincible)return;
    const stomped=player.body.velocity.y>0&&player.y<goomba.y-8;
    if(stomped){
      goomba.disableBody(true,true);
      player.setVelocityY(-320);
      // SCREEN SHAKE!
      this.cameras.main.shake(220,0.014);
      score+=100;
      this.scoreText.setText('🪙 '+String(score).padStart(3,'0'));
      sfxBlock();
      const t=this.add.text(goomba.x,goomba.y,'+100 STOMP!',{
        fontFamily:'Arial',fontSize:'14px',fill:'#ff8844',stroke:'#000',strokeThickness:3
      }).setDepth(30).setOrigin(0.5);
      this.tweens.add({targets:t,y:goomba.y-80,alpha:0,duration:800,onComplete:()=>t.destroy()});
    } else {
      if(this._isBig){
        // Big Mario shrinks instead of dying
        this._isBig=false;
        sfxShrink();
        this.sizeText.setText('▸ SMALL MARIO').setStyle({fill:'#88ccff'});
        this.player.setTexture('mario_idle');
        this.player.body.setSize(28,46);
        this._invincible=true;
        this.tweens.add({targets:this.player,alpha:0.3,duration:100,yoyo:true,repeat:10,
          onComplete:()=>{this.player.setAlpha(1);this._invincible=false;}});
        const t=this.add.text(player.x,player.y-30,'OUCH!',{
          fontFamily:'Arial',fontSize:'13px',fill:'#ff4444',stroke:'#000',strokeThickness:3
        }).setDepth(30).setOrigin(0.5);
        this.tweens.add({targets:t,y:player.y-90,alpha:0,duration:900,onComplete:()=>t.destroy()});
      } else {
        this._lives--;
        this.livesText.setText(this._lives>0?'♥ '.repeat(this._lives).trim():'✗ GAME OVER');
        this._invincible=true;
        this.cameras.main.shake(300,0.02);
        this.tweens.add({targets:this.player,alpha:0.3,duration:120,yoyo:true,repeat:8,
          onComplete:()=>{this.player.setAlpha(1);this._invincible=false;}});
        player.setVelocityY(-300);
        if(this._lives<=0){
          this.time.delayedCall(1000,()=>this.scene.restart());
          score=0;
        }
      }
    }
  }

  // ── UPDATE ──
  update(time,delta){
    const p=this.player;
    const onGround=p.body.blocked.down;
    const prefix=this._isBig?'mario_big_':'mario_';

    // ── MOVE ──
    if(this.cursors.left.isDown || window.mobileControls.left){
      p.setVelocityX(-230);p.setFlipX(true);
    } else if(this.cursors.right.isDown || window.mobileControls.right){
      p.setVelocityX(230);p.setFlipX(false);
    } else {
      p.setVelocityX(0);
    }

    // ── JUMP ──
    if((Phaser.Input.Keyboard.JustDown(this.cursors.up)||
        Phaser.Input.Keyboard.JustDown(this.keySpace) ||
        window.mobileControls.jump)&&onGround){
      p.setVelocityY(this._isBig?-520:-490);
      sfxJump();
      window.mobileControls.jump = false; // consume one-shot tap trigger
    }

    // ── ANIMATED MARIO TEXTURE ──
    if(!onGround){
      p.setTexture(prefix+'jump');
    } else if(Math.abs(p.body.velocity.x)>20){
      this._walkTimer+=delta;
      if(this._walkTimer>110){
        this._walkTimer=0;
        this._walkFrame=(this._walkFrame+1)%2;
        p.setTexture(prefix+(this._walkFrame===0?'walk1':'walk2'));
      }
    } else {
      p.setTexture(prefix+'idle');
    }

    // ── PIPE ENTER ──
    if(Phaser.Input.Keyboard.JustDown(this.keyDown) || window.mobileControls.down){
      window.mobileControls.down = false; // consume
      this.pipes.children.iterate(pipe=>{
        if(!pipe?.active)return;
        if(Math.abs(p.x-pipe.x)<42&&Math.abs(p.y-pipe.y)<95){
          sfxPipe();
          openModal(pipe.getData('modal'));
        }
      });
    }

    // ── GOOMBA PATROL ──
    this.goombas.children.iterate(g=>{
      if(!g?.active)return;
      if(g.body.blocked.left){g.setVelocityX(60);g.setFlipX(false);}
      if(g.body.blocked.right){g.setVelocityX(-60);g.setFlipX(true);}
    });

    // ── MUSHROOM PATROL ──
    this.mushrooms.children.iterate(m=>{
      if(!m?.active)return;
      if(m.body.blocked.left||m.body.blocked.right){m.setVelocityX(-m.body.velocity.x);}
    });

    // ── DAY / NIGHT CYCLE (based on scroll) ──
    const scrollX=this.cameras.main.scrollX;
    const progress=Math.min(scrollX/2400,1); // 0=day, 1=night
    // Sky colors: day=0x5c94fc → dusk=0xff7744 → night=0x0a0a2e
    let skyColor, starsAlpha, timeLabel;
    if(progress<0.5){
      // Day → Dusk
      const t=progress*2;
      const r=Math.floor(0x5c+(0xff-0x5c)*t);
      const g=Math.floor(0x94+(0x77-0x94)*t);
      const b=Math.floor(0xfc+(0x44-0xfc)*t);
      skyColor=(r<<16)|(g<<8)|b;
      starsAlpha=0;
      timeLabel=progress<0.25?'☀️ DAY':'🌅 DUSK';
    } else {
      // Dusk → Night
      const t=(progress-0.5)*2;
      const r=Math.floor(0xff+(0x0a-0xff)*t);
      const g=Math.floor(0x77+(0x0a-0x77)*t);
      const b=Math.floor(0x44+(0x2e-0x44)*t);
      skyColor=(r<<16)|(g<<8)|b;
      starsAlpha=t*0.85;
      timeLabel=progress>0.85?'🌙 NIGHT':'🌆 EVENING';
    }
    this.skyRect.setFillStyle(skyColor);
    this.starsGfx.setAlpha(starsAlpha);
    this.timeText.setText(timeLabel);

    // ── SECTION LABEL ──
    let sec=this._sections[0];
    for(const s of this._sections){if(p.x>=s.x)sec=s;}
    if(sec.label!==this._lastSection){
      this._lastSection=sec.label;
      this.sectionText.setText(sec.label);
      this._banner.setText('— '+sec.label+' —').setAlpha(1);
      this.tweens.add({targets:this._banner,alpha:0,delay:2200,duration:500});
    }

    // ── VICTORY ──
    if(!this._victoryDone&&p.x>=2860){
      this._victoryDone=true;
      this._doVictory();
    }
  }

  _doVictory(){
    sfxVictory();
    const colors=[0xffd700,0xff4444,0x44ff44,0x4488ff,0xff88ff,0xffaa00];
    for(let i=0;i<50;i++){
      const c=this.add.rectangle(
        this.player.x+(Math.random()-0.5)*300,
        this.player.y-Math.random()*80,
        8,8,colors[Math.floor(Math.random()*colors.length)]
      ).setDepth(50);
      this.tweens.add({targets:c,
        y:c.y+280+Math.random()*100,x:c.x+(Math.random()-0.5)*130,
        angle:720,alpha:0,delay:i*35,duration:1500,
        onComplete:()=>c.destroy()});
    }
    this.cameras.main.shake(600,0.018);
    setTimeout(()=>openModal('victory'),1800);
  }
}
